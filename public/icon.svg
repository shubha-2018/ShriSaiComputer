<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rectangle with subtle gold border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4" />

  <!-- Computer screen graphic -->
  <g filter="url(#shadow)" transform="translate(96, 88)">
    <!-- Monitor Outer Body -->
    <rect x="16" y="16" width="288" height="196" rx="20" fill="#ffffff" />
    <rect x="28" y="28" width="264" height="172" rx="12" fill="#0f172a" />
    
    <!-- Screen Accent Display -->
    <rect x="42" y="42" width="236" height="42" rx="8" fill="rgba(37, 99, 235, 0.25)" />
    <!-- Pulse Line / Citizen service doc -->
    <circle cx="64" cy="63" r="10" fill="#10b981" />
    <rect x="86" y="58" width="90" height="10" rx="5" fill="#93c5fd" />
    <rect x="186" y="58" width="70" height="10" rx="5" fill="#f59e0b" />

    <!-- Center Monogram SS & Devanagari श्री -->
    <text x="160" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">SHREE SAI</text>
    <text x="160" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="1">COMPUTER SERVICES</text>

    <!-- Monitor Stand -->
    <path d="M 136 212 L 184 212 L 194 252 L 126 252 Z" fill="#e2e8f0" />
    <rect x="100" y="252" width="120" height="14" rx="7" fill="url(#accentGrad)" />
  </g>

  <!-- Golden Emblem Stamp on top right -->
  <circle cx="396" cy="116" r="44" fill="url(#accentGrad)" filter="url(#shadow)" />
  <circle cx="396" cy="116" r="38" fill="#1e3a8a" />
  <text x="396" y="126" font-family="'Noto Sans Devanagari', 'Mangal', sans-serif" font-size="28" font-weight="800" fill="#fbbf24" text-anchor="middle">श्री</text>
</svg>
